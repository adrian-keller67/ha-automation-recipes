id: "r44_esp_status_led_sync"
alias: "R44 ESPHome status LED sync"
description: "Mirror house_away helper to an ESPHome LED light."
mode: single
triggers:
  - trigger: state
    entity_id: input_boolean.house_away
conditions: []
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.house_away
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.esphome_status_led
            data:
              brightness_pct: 100
      - conditions:
          - condition: state
            entity_id: input_boolean.house_away
            state: "off"
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.esphome_status_led
