id: "r20_heat_boost_30min"
alias: "R20 Heat boost 30 minutes"
description: "Temporary temperature boost when helper turns on, then restore."
mode: restart
triggers:
  - trigger: state
    entity_id: input_boolean.heat_boost
    to: "on"
conditions: []
actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.living_room
    data:
      temperature: 23
  - delay:
      minutes: 30
  - action: climate.set_temperature
    target:
      entity_id: climate.living_room
    data:
      temperature: 20
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.heat_boost
