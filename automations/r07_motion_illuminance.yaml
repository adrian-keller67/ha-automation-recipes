id: "r07_motion_illuminance"
alias: "R07 Motion light only if dark"
description: "Turn on light on motion when illuminance is below threshold."
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_motion
    from: "off"
    to: "on"
conditions:
  - condition: numeric_state
    entity_id: sensor.living_room_illuminance
    below: 40
actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      brightness_pct: 80
  - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.living_room_motion
        from: "on"
        to: "off"
  - delay:
      minutes: 3
  - action: light.turn_off
    target:
      entity_id: light.living_room
