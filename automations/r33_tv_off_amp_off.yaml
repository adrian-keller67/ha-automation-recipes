id: "r33_tv_off_amp_off"
alias: "R33 TV off turns amp off"
description: "When TV goes off, wait briefly then power down amplifier switch."
mode: single
triggers:
  - trigger: state
    entity_id: media_player.living_room_tv
    to: "off"
    for:
      minutes: 2
conditions: []
actions:
  - action: switch.turn_off
    target:
      entity_id: switch.living_room_amplifier
