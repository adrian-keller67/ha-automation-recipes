# R04 Late arrival dimmed / Späte Ankunft gedimmt
id: "r04_late_arrival_dimmed"
alias: "R04 Late arrival dimmed"
description: "Soft hallway + living room lights if someone arrives between 22:00 and 06:00."
mode: single
triggers:
  - trigger: zone
    entity_id: person.alex
    zone: zone.home
    event: enter
  - trigger: zone
    entity_id: person.sam
    zone: zone.home
    event: enter
conditions:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: "off"
  - condition: time
    after: "22:00:00"
    before: "06:00:00"
actions:
  - action: light.turn_on
    target:
      entity_id:
        - light.hallway
        - light.living_room
    data:
      brightness_pct: 15
