id: "r09_sunset_living_room"
alias: "R09 Sunset living room"
description: "Turn living room lights on 20 minutes before sunset if someone is home."
mode: single
triggers:
  - trigger: sun
    event: sunset
    offset: "-00:20:00"
conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      brightness_pct: 55
      color_temp_kelvin: 3000
