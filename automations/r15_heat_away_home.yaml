id: "r15_heat_away_home"
alias: "R15 Heat away and home presets"
description: "Set climate to eco when house empty; comfort when someone arrives."
mode: single
triggers:
  - trigger: state
    entity_id: zone.home
    to: "0"
    id: empty
  - trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: occupied
conditions:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: "off"
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: empty
        sequence:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.living_room
            data:
              preset_mode: eco
      - conditions:
          - condition: trigger
            id: occupied
        sequence:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.living_room
            data:
              preset_mode: home
