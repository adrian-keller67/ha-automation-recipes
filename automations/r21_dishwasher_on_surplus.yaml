id: "r21_dishwasher_on_surplus"
alias: "R21 Dishwasher on solar surplus"
description: "Start dishwasher when export power stays high; safety-first example."
mode: single
triggers:
  - trigger: numeric_state
    entity_id: sensor.grid_export_power
    above: 800
    for:
      minutes: 5
conditions:
  - condition: state
    entity_id: input_boolean.auto_dishwasher
    state: "on"
  - condition: state
    entity_id: binary_sensor.dishwasher_door
    state: "off"
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.dishwasher_start
