id: "r16_window_open_pause_heat"
alias: "R16 Window open pause heat"
description: "When a window opens, set climate off; restore when closed."
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_window
    to: "on"
    id: open
  - trigger: state
    entity_id: binary_sensor.living_room_window
    to: "off"
    id: closed
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: open
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.living_room
            data:
              hvac_mode: "off"
      - conditions:
          - condition: trigger
            id: closed
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.living_room
            data:
              hvac_mode: heat
