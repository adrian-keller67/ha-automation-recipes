id: "r17_weekday_climate_schedule"
alias: "R17 Weekday climate schedule"
description: "Comfort temperature weekday mornings and evenings."
mode: single
triggers:
  - trigger: time
    at: "06:00:00"
    id: morning
  - trigger: time
    at: "17:30:00"
    id: evening
  - trigger: time
    at: "22:30:00"
    id: night
conditions:
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: morning
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.living_room
            data:
              temperature: 21
      - conditions:
          - condition: trigger
            id: evening
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.living_room
            data:
              temperature: 21.5
      - conditions:
          - condition: trigger
            id: night
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.living_room
            data:
              temperature: 18
